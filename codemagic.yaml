workflows:
  last-storyteller-ios:
    name: Last Storyteller iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Dedicated Apple Developer Portal / App Store Connect API key.
      # Must match the Codemagic integration name exactly (spaces included).
      app_store_connect: "Last Storyteller Codemagic"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.laststoryteller.app
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # Bump when shipping a new TestFlight binary. The WKWebView loads
        # https://laststoryteller.com, so Render deploys web UX (including
        # story video loading) without baking Next.js into the IPA.
        MARKETING_VERSION: "0.1.1"
        NODE_VERSION: "20"
        # Existing App Store Connect app. Do not create a second app.
        APP_STORE_APPLE_ID: "6812527848"
        PRODUCTION_APP_URL: "https://laststoryteller.com"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      # Do NOT inject Render/Stripe/Supabase/R2 secrets here. The iOS shell
      # does not run Next.js. It loads PRODUCTION_APP_URL in WKWebView.
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Patch iOS Info.plist, privacy manifest, and App Icon
        script: |
          node scripts/patch-ios-info.mjs
      # Export compliance questionnaire (App Uses Non-Exempt Encryption).
      # Codemagic/Apple flag the IPA until this is in the built Info.plist.
      # Same answer as App Store Connect: standard HTTPS/TLS only, not custom crypto.
      - name: Attach export compliance questionnaire
        script: |
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"
          PLIST_BUDDY=/usr/libexec/PlistBuddy
          if ! $PLIST_BUDDY -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"; then
            $PLIST_BUDDY -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          fi
          $PLIST_BUDDY -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set marketing version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload to TestFlight. Do not submit for App Store review.
        submit_to_testflight: true
        submit_to_app_store: false
